# ==============================================================================
# Render Blueprint Specification — Affidavit AI System
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: affidavit-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
